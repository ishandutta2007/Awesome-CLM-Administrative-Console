<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Keyframe Animations -->
    <style>
      .orb-pulse-1 {
        animation: pulse1 6s ease-in-out infinite alternate;
      }
      .orb-pulse-2 {
        animation: pulse2 8s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: dashMove 20s linear infinite;
      }
      .float-pill-1 {
        animation: floatA 5s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: floatB 6s ease-in-out infinite alternate;
      }
      .float-pill-3 {
        animation: floatA 7s ease-in-out infinite alternate;
      }
      .radar-sweep {
        transform-origin: 1040px 100px;
        animation: rotateSweep 10s linear infinite;
      }
      .pulse-dot {
        animation: dotBlink 2.5s ease-in-out infinite;
      }

      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.25) translate(40px, -20px); opacity: 0.6; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.1) translate(0, 0); opacity: 0.25; }
        100% { transform: scale(0.9) translate(-50px, 30px); opacity: 0.55; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -320; }
      }
      @keyframes floatA {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatB {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dotBlink {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Border Stroke -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Background Animated Glowing Orbs (Strictly behind content) -->
  <g opacity="0.8">
    <circle class="orb-pulse-1" cx="180" cy="90" r="140" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />
    <circle class="orb-pulse-2" cx="1020" cy="320" r="180" fill="#818cf8" opacity="0.25" filter="url(#glow)" />
    <circle class="orb-pulse-1" cx="620" cy="20" r="110" fill="#c084fc" opacity="0.2" filter="url(#glow)" />
  </g>

  <!-- Tech Subtle Grid Mesh -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Tech Circuit Flows (Behind Foreground text) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 50 360 C 250 360, 320 390, 500 390 C 750 390, 850 370, 1150 370" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 50 375 C 220 375, 380 345, 600 345 C 800 345, 950 395, 1150 395" fill="none" stroke="#a855f7" stroke-width="1.5" />
    
    <!-- Top Right Decorative Radar Dial -->
    <circle cx="1040" cy="100" r="60" fill="none" stroke="#334155" stroke-width="1.5" />
    <circle cx="1040" cy="100" r="38" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="1040" cy="100" r="5" fill="#38bdf8" />
    <g class="radar-sweep">
      <line x1="1040" y1="100" x2="1100" y2="100" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges, and Metadata -->
  
  <!-- Category Pill Badge -->
  <g transform="translate(80, 52)">
    <rect width="275" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle class="pulse-dot" cx="18" cy="16" r="4.5" fill="#38bdf8" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">ENTERPRISE CLM ARCHITECTURE</text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(870, 52)">
    <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
    <circle class="pulse-dot" cx="18" cy="16" r="4.5" fill="#10b981" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34d399">GOVERNANCE &amp; RBAC CONSOLE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 142)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#softShadow)">
      Awesome CLM Administrative Console
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 184)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Ecosystem of Enterprise SaaS Consoles &amp; Open-Source Self-Hosted Engines
    </text>
  </g>

  <!-- Tagline Specs -->
  <g transform="translate(80, 214)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
      Role-Based Access Control (RBAC)  •  Tenant Isolation  •  Workflow Routing  •  Audit Logging  •  LegalTech AI
    </text>
  </g>

  <!-- Interactive/Dynamic Metric Pills in Lower Foreground -->
  
  <!-- Pill 1: SaaS Leaders -->
  <g class="float-pill-1" transform="translate(80, 260)" filter="url(#softShadow)">
    <rect width="230" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect width="4" height="40" x="0" y="17" rx="2" fill="#38bdf8" />
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">COMMERCIAL LEADERS</text>
    <text x="22" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">10+ Top SaaS Consoles</text>
  </g>

  <!-- Pill 2: Open Source -->
  <g class="float-pill-2" transform="translate(330, 260)" filter="url(#softShadow)">
    <rect width="230" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect width="4" height="40" x="0" y="17" rx="2" fill="#818cf8" />
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">SELF-HOSTED / FLOSS</text>
    <text x="22" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">11+ GitHub Repos</text>
  </g>

  <!-- Pill 3: Enterprise RBAC -->
  <g class="float-pill-3" transform="translate(580, 260)" filter="url(#softShadow)">
    <rect width="240" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect width="4" height="40" x="0" y="17" rx="2" fill="#c084fc" />
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">GOVERNANCE &amp; AUDITING</text>
    <text x="22" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Multi-Tenant &amp; RBAC</text>
  </g>

  <!-- Pill 4: Market Dynamics -->
  <g class="float-pill-1" transform="translate(840, 260)" filter="url(#softShadow)">
    <rect width="280" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect width="4" height="40" x="0" y="17" rx="2" fill="#34d399" />
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">MARKET DYNAMICS (2026)</text>
    <text x="22" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#34d399">$3.7B Market • 12% CAGR</text>
  </g>

</svg>
